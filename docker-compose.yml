services:
  postgres:
    image: postgres:16
    container_name: engineer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: engineer
      POSTGRES_PASSWORD: engineer_dev_password
      POSTGRES_DB: engineer
    ports:
      - "5432:5432"
    volumes:
      - engineer_pgdata:/var/lib/postgresql/data
volumes:
  engineer_pgdata: